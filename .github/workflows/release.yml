name: Signed release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.MAPPIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAPPIX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAPPIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAPPIX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo 'Missing MAPPIX_* signing secrets' >&2; exit 1;
          }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mappix-release.jks"
      - name: Build signed APK and unit tests
        env:
          MAPPIX_KEYSTORE_PATH: ${{ runner.temp }}/mappix-release.jks
          MAPPIX_KEYSTORE_PASSWORD: ${{ secrets.MAPPIX_KEYSTORE_PASSWORD }}
          MAPPIX_KEY_ALIAS: ${{ secrets.MAPPIX_KEY_ALIAS }}
          MAPPIX_KEY_PASSWORD: ${{ secrets.MAPPIX_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:testDebugUnitTest
      - name: Make checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/mappix-${GITHUB_REF_NAME}.apk
          (cd dist && sha256sum *.apk > mappix-${GITHUB_REF_NAME}.apk.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
